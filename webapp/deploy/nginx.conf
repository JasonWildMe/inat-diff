# Throttle admin Basic-auth attempts (each one costs a bcrypt check)
limit_req_zone $binary_remote_addr zone=invasives_admin:10m rate=10r/m;

server {
    listen 80;
    server_name invasives.wildme.org;
    server_tokens off;
    client_max_body_size 64k;

    # Redirect HTTP to HTTPS (after SSL setup)
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr (not $proxy_add_x_forwarded_for): don't forward a client-supplied
        # X-Forwarded-For that the app's per-IP rate limiter could be fooled by.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    location /admin {
        limit_req zone=invasives_admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files
    location /static {
        alias /opt/invasives/inat-diff/webapp/static;
        expires 7d;
        # Spread-map geometry (~1.2 MB JSON) and scripts compress ~4x; nginx's default
        # gzip_types covers only text/html. URLs carry ?v=<hash>, so 7-day caching is safe.
        gzip on;
        gzip_types application/json application/javascript text/javascript text/css;
    }

    # Reports (can be large)
    location /report {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 5s;
    }
}

